name: fb-poster
services:
  - name: web
    type: web
    instance_types:
      - type: free
    ports:
      - port: 8000
        protocol: http
    routes:
      - path: /
    health_checks:
      - port: 8000
        path: /api/health
        check_interval: 60
    env:
      - name: PORT
        value: "8000"
      # secrets set in Koyeb dashboard (sync via UI):
      # SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
    build:
      type: buildpack
      build_command: npm install
    run: npm start